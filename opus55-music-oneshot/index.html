<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melody Memory</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#eee;font-family:system-ui,sans-serif;touch-action:manipulation}
h1{margin:.3em}#info{margin:.5em;min-height:1.4em}
#pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,420px)}
.pad{aspect-ratio:1;border:0;border-radius:16px;opacity:.55;font-size:1.2em;color:#000;font-weight:bold;transition:opacity .1s,transform .1s}
.pad.on{opacity:1;transform:scale(.95)}
#start{margin:1em;padding:.7em 2em;font-size:1.1em;border:0;border-radius:99px;background:#fff}
</style></head><body>
<h1>Melody Memory</h1>
<div id="info">Press Start, listen, then repeat the melody.</div>
<div id="pads"></div>
<button id="start">Start</button>
<script>
const notes=[261.63,293.66,329.63,392,440,523.25],names=['C','D','E','G','A','C'],
cols=['#f55','#fa3','#fe4','#5d6','#4af','#a7f'];
let ac,seq=[],pos=0,busy=true;
const pads=notes.map((f,i)=>{const b=document.createElement('button');b.className='pad';
b.style.background=cols[i];b.textContent=names[i];b.onpointerdown=()=>press(i);
document.getElementById('pads').append(b);return b});
const info=document.getElementById('info');
function tone(i,d=.35){ac??=new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
o.type='triangle';o.frequency.value=notes[i];g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);
pads[i].classList.add('on');setTimeout(()=>pads[i].classList.remove('on'),d*600)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){busy=true;info.textContent='Listen... (length '+seq.length+')';await wait(600);
for(const i of seq){tone(i);await wait(Math.max(250,500-seq.length*15))}busy=false;pos=0;info.textContent='Your turn!'}
function next(){seq.push(Math.floor(Math.random()*6));play()}
function press(i){tone(i);if(busy)return;
if(i!==seq[pos]){busy=true;info.textContent='Wrong! Score: '+(seq.length-1)+'. Press Start.';
const o=ac.createOscillator();o.frequency.value=110;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.3);return}
if(++pos===seq.length){busy=true;info.textContent='Nice!';setTimeout(next,500)}}
document.getElementById('start').onclick=()=>{ac??=new AudioContext();ac.resume();seq=[];next()};
</script></body></html>
